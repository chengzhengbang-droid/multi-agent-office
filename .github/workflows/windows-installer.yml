name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"

      - name: Compute monotonically increasing release version
        id: release_version
        shell: bash
        run: |
          base_version=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "$base_version"
          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "package.json version must contain major.minor.patch" >&2
            exit 1
          fi
          release_patch=$((patch * 100000 + GITHUB_RUN_NUMBER))
          release_version="$major.$minor.$release_patch"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Building Multi-Agent Office v$release_version"

  build-windows-installer:
    name: Build Windows x64 installer
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $package.version = "${{ needs.prepare-release.outputs.release-version }}"
          $package | ConvertTo-Json -Depth 100 | Set-Content "package.json" -Encoding utf8

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm dist:win

      - name: Smoke-test silent installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-windows-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created" }

          $installDir = Join-Path $env:RUNNER_TEMP "multi-agent-office-smoke"
          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList "/S", "/D=$installDir" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)"
          }

          $executable = Join-Path $installDir "Multi-Agent Office.exe"
          if (-not (Test-Path $executable)) {
            throw "Installed executable was not found at $executable"
          }

          $smokeData = Join-Path $env:RUNNER_TEMP "multi-agent-office-user-data"
          $appProcess = Start-Process `
            -FilePath $executable `
            -ArgumentList "--smoke-test", "--user-data-dir=$smokeData" `
            -Wait `
            -PassThru
          if ($appProcess.ExitCode -ne 0) {
            throw "Installed application exited with code $($appProcess.ExitCode)"
          }

          $desktopLog = Join-Path $smokeData "desktop.log"
          if (-not (Test-Path $desktopLog)) {
            throw "Installed application did not create desktop.log"
          }
          if (-not (Select-String -Path $desktopLog -Pattern "Local server ready" -Quiet)) {
            Get-Content $desktopLog
            throw "Installed application did not start its local server"
          }

          $windowSmokeData = Join-Path $env:RUNNER_TEMP "multi-agent-office-window-user-data"
          $windowProcess = Start-Process `
            -FilePath $executable `
            -ArgumentList "--smoke-test-window", "--user-data-dir=$windowSmokeData" `
            -PassThru
          if (-not $windowProcess.WaitForExit(30000)) {
            Stop-Process -Id $windowProcess.Id -Force
            throw "Installed application did not finish its window smoke test"
          }
          if ($windowProcess.ExitCode -ne 0) {
            throw "Window smoke test exited with code $($windowProcess.ExitCode)"
          }

          $windowLog = Join-Path $windowSmokeData "desktop.log"
          if (-not (Test-Path $windowLog)) {
            throw "Window smoke test did not create desktop.log"
          }
          if (-not (Select-String -Path $windowLog -Pattern "Main window ready" -Quiet)) {
            Get-Content $windowLog
            throw "Installed application did not load its main window"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: multi-agent-office-windows-x64-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

  build-macos-installer:
    name: Build macOS universal installer
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
        run: |
          node -e 'const fs = require("node:fs"); const packageJson = require("./package.json"); packageJson.version = process.env.RELEASE_VERSION; fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);'

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm run build

      - name: Detect notarization credentials
        id: notarization
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple notarization secrets are not configured; producing an unsigned test installer."
          fi

      - name: Build macOS DMG and update ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --publish never -c.mac.notarize=${{ steps.notarization.outputs.enabled }}

      - name: Smoke-test packaged application
        run: |
          executable="release/mac-universal/Multi-Agent Office.app/Contents/MacOS/Multi-Agent Office"
          if [[ ! -x "$executable" ]]; then
            echo "Packaged application executable was not found" >&2
            exit 1
          fi
          smoke_data="$RUNNER_TEMP/multi-agent-office-mac-user-data"
          "$executable" --smoke-test --user-data-dir="$smoke_data"
          if ! grep -q "Local server ready" "$smoke_data/desktop.log"; then
            cat "$smoke_data/desktop.log"
            echo "Packaged macOS application did not start its local server" >&2
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: multi-agent-office-macos-universal-${{ github.run_number }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish desktop installers
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs:
      - prepare-release
      - build-windows-installer
      - build-macos-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v6
        with:
          name: multi-agent-office-windows-x64-${{ github.run_number }}
          path: release

      - name: Download macOS installer
        uses: actions/download-artifact@v6
        with:
          name: multi-agent-office-macos-universal-${{ github.run_number }}
          path: release

      - name: Add installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('main-build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.prepare-release.outputs.release-version) }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
