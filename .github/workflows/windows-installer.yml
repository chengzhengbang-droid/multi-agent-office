name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm dist:win

      - name: Smoke-test silent installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-windows-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created" }

          $installDir = Join-Path $env:RUNNER_TEMP "multi-agent-office-smoke"
          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList "/S", "/D=$installDir" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)"
          }

          $executable = Join-Path $installDir "Multi-Agent Office.exe"
          if (-not (Test-Path $executable)) {
            throw "Installed executable was not found at $executable"
          }

          $smokeData = Join-Path $env:RUNNER_TEMP "multi-agent-office-user-data"
          $appProcess = Start-Process `
            -FilePath $executable `
            -ArgumentList "--smoke-test", "--user-data-dir=$smokeData" `
            -Wait `
            -PassThru
          if ($appProcess.ExitCode -ne 0) {
            throw "Installed application exited with code $($appProcess.ExitCode)"
          }

          $desktopLog = Join-Path $smokeData "desktop.log"
          if (-not (Test-Path $desktopLog)) {
            throw "Installed application did not create desktop.log"
          }
          if (-not (Select-String -Path $desktopLog -Pattern "Local server ready" -Quiet)) {
            Get-Content $desktopLog
            throw "Installed application did not start its local server"
          }

          $windowSmokeData = Join-Path $env:RUNNER_TEMP "multi-agent-office-window-user-data"
          $windowProcess = Start-Process `
            -FilePath $executable `
            -ArgumentList "--smoke-test-window", "--user-data-dir=$windowSmokeData" `
            -PassThru
          if (-not $windowProcess.WaitForExit(30000)) {
            Stop-Process -Id $windowProcess.Id -Force
            throw "Installed application did not finish its window smoke test"
          }
          if ($windowProcess.ExitCode -ne 0) {
            throw "Window smoke test exited with code $($windowProcess.ExitCode)"
          }

          $windowLog = Join-Path $windowSmokeData "desktop.log"
          if (-not (Test-Path $windowLog)) {
            throw "Window smoke test did not create desktop.log"
          }
          if (-not (Select-String -Path $windowLog -Pattern "Main window ready" -Quiet)) {
            Get-Content $windowLog
            throw "Installed application did not load its main window"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: multi-agent-office-windows-x64-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Windows installer
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read package version
        id: package_version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v6
        with:
          name: multi-agent-office-windows-x64-${{ github.run_number }}
          path: release

      - name: Add installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('main-build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.package_version.outputs.version) }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
