name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Types, lessons and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # lessons 闸门要跟基分支求 merge-base，浅克隆会让它退化成"跳过"。
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check:types

      # 改了代码就必须在 lessons/ 里留下一条记录。理由见 lessons/rules.md 规矩 7。
      - name: Check lessons
        env:
          LESSONS_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:lessons

      - name: Run tests
        run: pnpm test
